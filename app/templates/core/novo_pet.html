{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; text-align: center;">
    
    <img src="{{ url_for('static', filename='patas.png') }}" alt="Logo Caderneta PET" style="width: 55px; height: 55px; margin-bottom: 15px; object-fit: contain;">

    <h2 style="color: #064e3b; margin-bottom: 25px;">Cadastrar Novo Pet</h2>
    
    <!-- O enctype é obrigatório para enviar imagens -->
    <form method="post" enctype="multipart/form-data" style="text-align: left;">
        
        <label for="foto" style="font-weight: bold; color: #374151;">Foto do Pet (Opcional)</label>
        <input type="file" name="foto" id="foto" accept="image/*" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;">

        <label for="nome" style="font-weight: bold; color: #374151;">Nome do Pet *</label>
        <input type="text" name="nome" id="nome" required placeholder="Ex: Rex" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px;">

        <label for="especie" style="font-weight: bold; color: #374151; display: block;">Espécie *</label>
        <select name="especie" id="especie" required style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px;">
            <option value="">Selecione a espécie...</option>
            <option value="Cachorro">Cachorro</option>
            <option value="Gato">Gato</option>
        </select>

        <label for="raca" style="font-weight: bold; color: #374151; display: block;">Raça</label>
        <input type="text" name="raca" id="raca" list="lista-racas" required placeholder="Digite ou selecione a raça" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px;">
        <datalist id="lista-racas"></datalist>

        <label for="data_nascimento" style="font-weight: bold; color: #374151; display: block;">Data de Nascimento *</label>
        <input type="date" name="data_nascimento" id="data_nascimento" required style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px;">

        <label for="peso_atual_kg" style="font-weight: bold; color: #374151; display: block;">Peso (kg) *</label>
        <input type="number" step="0.1" name="peso_atual_kg" id="peso_atual_kg" required placeholder="Ex: 5.5" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px;">

        <label for="numero_microchip" style="font-weight: bold; color: #374151; display: block;">Número do Microchip (Opcional)</label>
        <input type="text" name="numero_microchip" id="numero_microchip" placeholder="Deixe em branco se não possuir" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px;">

        <div style="display: flex; gap: 15px; margin-top: 25px;">
            <button type="submit" style="flex: 2; background: #10b981; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: filter 0.3s;">
                Cadastrar Pet
            </button>
            <a href="{{ url_for('core.index') }}" style="flex: 1; display: flex; align-items: center; justify-content: center; background: #f3f4f6; color: #4b5563; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid #d1d5db; transition: background 0.3s;">
                Cancelar
            </a>
        </div>
    </form>
    
<script>
  async function carregarRacas() {
    const especie = document.getElementById('especie').value;
    const datalist = document.getElementById('lista-racas');
    const inputRaca = document.getElementById('raca');

    datalist.innerHTML = '';
    const optSrd = document.createElement('option');
    optSrd.value = 'SRD (Sem Raça Definida)';
    datalist.appendChild(optSrd);

    if (!especie) return;

    inputRaca.placeholder = "A carregar raças da API...";
    inputRaca.disabled = true;

    try {
      const urlLocal = `/api/racas/${especie}`;
      const resposta = await fetch(urlLocal);
      
      if (!resposta.ok) {
        throw new Error('Falha no servidor interno: ' + resposta.status);
      }

      const racas = await resposta.json();
      racas.forEach(raca => {
        const opcao = document.createElement('option');
        opcao.value = raca.name;
        datalist.appendChild(opcao);
      });

      inputRaca.placeholder = "Clique para selecionar ou digite a raça...";
    } catch (erro) {
      console.error('Erro de integração com a API externa:', erro);
      inputRaca.placeholder = "Erro na API. Digite a raça manualmente.";
    } finally {
      inputRaca.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    const selectEspecie = document.getElementById('especie');
    if (selectEspecie) {
      selectEspecie.addEventListener('change', carregarRacas);
    }
  });
</script>
</div>
{% endblock %}
