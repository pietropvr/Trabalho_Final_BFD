{% extends 'base.html' %}

{% block content %}
  <h2>Cadastrar Novo Pet</h2>
  <form method="post">
    <label for="nome">Nome do Pet *</label>
    <input type="text" name="nome" id="nome" required>

    <label for="especie">Espécie *</label>
    <select name="especie" id="especie" required>
        <option value="">Selecione...</option>
        <option value="Cão">Cão</option>
        <option value="Gato">Gato</option>
        <option value="Outro">Outro</option>
    </select>

    <label for="raca">Raça</label>
    <input type="text" name="raca" id="raca" placeholder="Ex: Poodle, Siamês">

    <label for="data_nascimento">Data de Nascimento (Aproximada)</label>
    <input type="date" name="data_nascimento" id="data_nascimento">

    <label for="peso_atual_kg">Peso (kg)</label>
    <input type="number" step="0.1" name="peso_atual_kg" id="peso_atual_kg" placeholder="Ex: 4.5">

    <label for="numero_microchip">Número do Microchip</label>
    <input type="text" name="numero_microchip" id="numero_microchip" placeholder="Se possuir">

    <button type="submit">Salvar Pet</button>
  </form>
{% endblock %}
