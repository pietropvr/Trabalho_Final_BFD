<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Médico Offline</title>
    <!-- Fonte Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', Tahoma, sans-serif; padding: 30px; background-color: #f3f4f6; color: #1f2937; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .cabecalho-pet { display: flex; align-items: center; gap: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #064e3b; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 10px; }
        .info-pet { display: flex; flex-wrap: wrap; gap: 20px; background: #f9fafb; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #d1d5db; }
        .info-pet p { margin: 0; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #d1d5db; border-radius: 5px; box-sizing: border-box; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #10b981; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #064e3b; color: white; }
        tr:hover { background-color: #f3f4f6; }
        .btn-imprimir { float: right; padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        
        /* Regras para não imprimir os botões e a barra de pesquisa */
        @media print { 
            .no-print { display: none !important; } 
            body { padding: 0; background: white; } 
            .container { box-shadow: none; padding: 0; } 
        }
    </style>
</head>
<body>
    <button onclick="window.print()" class="btn-imprimir no-print">🖨️ Imprimir / Salvar PDF</button>

    <div class="container">
        
        <!-- Cabeçalho com o container da Foto -->
        <div class="cabecalho-pet">
            <div id="foto-container"></div>
            <h1><span>🐾</span> Prontuário Médico: <span id="pet-nome"></span></h1>
        </div>
        
        <div class="info-pet">
            <p><strong>Espécie:</strong> <span id="pet-especie"></span></p>
            <p><strong>Raça:</strong> <span id="pet-raca"></span></p>
            <p><strong>Peso (kg):</strong> <span id="pet-peso"></span></p>
            <p><strong>Microchip:</strong> <span id="pet-microchip"></span></p>
        </div>

        <input type="text" id="filtro" class="no-print" placeholder="Pesquisar por tipo (ex: Vacina) ou descrição..." onkeyup="filtrarRegistros()" aria-label="Pesquisar registros médicos">

        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Retorno</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- Linhas geradas pelo JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Elementos HTML invisíveis que guardam os dados vindos do Python -->
    <script id="pet-data" type="application/json">
        {{ pet_json | safe }}
    </script>
    <script id="registros-data" type="application/json">
        {{ registros_json | safe }}
    </script>

    <script>
        const pet = JSON.parse(document.getElementById('pet-data').textContent);
        const registros = JSON.parse(document.getElementById('registros-data').textContent);
        
        // Recebe a foto em formato Base64 diretamente do Flask
        const fotoB64 = '{{ foto_b64 }}';

        // Injeta a foto na página se ela existir
        if (fotoB64) {
            document.getElementById('foto-container').innerHTML = `<img src="data:image/jpeg;base64,${fotoB64}" alt="Foto do Pet" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #10b981;">`;
        } else {
            document.getElementById('foto-container').style.display = 'none';
        }

        document.getElementById('pet-nome').textContent = pet.nome;
        document.getElementById('pet-especie').textContent = pet.especie;
        document.getElementById('pet-raca').textContent = pet.raca || 'Não informada';
        document.getElementById('pet-peso').textContent = pet.peso ? pet.peso.toFixed(1) : 'Não informado';
        document.getElementById('pet-microchip').textContent = pet.microchip || 'Sem microchip';

        function formatarData(dataISO) {
            if (!dataISO) return '-';
            return dataISO.split('-').reverse().join('/');
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = ''; 
            
            if (dados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#6b7280; padding: 20px;">Nenhum registro encontrado.</td></tr>';
                return;
            }

            dados.forEach(reg => {
                // Adiciona o selo visual dependendo da coluna 'concluido'
                const statusHtml = reg.concluido ? '<span style="color: #10b981; font-weight: bold;">✅ Concluído</span>' : '<span style="color: #d97706; font-weight: bold;">⏳ Pendente</span>';
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${formatarData(reg.data_registro)}</td>
                    <td><strong>${reg.tipo}</strong></td>
                    <td>${reg.descricao}</td>
                    <td>${formatarData(reg.data_retorno)}</td>
                    <td>${statusHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarRegistros() {
            const termo = document.getElementById('filtro').value.toLowerCase();
            const filtrados = registros.filter(reg => 
                reg.tipo.toLowerCase().includes(termo) || 
                reg.descricao.toLowerCase().includes(termo)
            );
            renderizarTabela(filtrados);
        }

        renderizarTabela(registros);
    </script>
</body>
</html>
