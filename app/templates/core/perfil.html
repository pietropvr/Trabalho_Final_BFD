{% extends 'base.html' %}

{% block content %}
  <header style="margin-bottom: 30px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px;">
      <h2 style="color: #064e3b; display: flex; align-items: center; gap: 10px; margin: 0;">
          <span style="font-size: 1.5rem;">👤</span> Perfil do Tutor
      </h2>
  </header>

  <div style="background: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #e5e7eb; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: bold; color: #6b7280; font-size: 0.9em; margin-bottom: 5px;">Nome Completo</label>
          <div style="font-size: 1.1em; color: #1f2937; padding: 10px; background: #f9fafb; border-radius: 5px; border: 1px solid #e5e7eb;">
              {{ g.tutor['nome'] }}
          </div>
      </div>

      <div style="margin-bottom: 30px;">
          <label style="display: block; font-weight: bold; color: #6b7280; font-size: 0.9em; margin-bottom: 5px;">E-mail de Acesso</label>
          <div style="font-size: 1.1em; color: #1f2937; padding: 10px; background: #f9fafb; border-radius: 5px; border: 1px solid #e5e7eb;">
              {{ g.tutor['email'] }}
          </div>
      </div>

      <!-- Novo Formulário de Alteração de Senha -->
      <div style="border-top: 1px solid #e5e7eb; padding-top: 20px;">
          <h3 style="color: #10b981; margin-bottom: 15px; font-size: 1.2rem;">Alterar Senha</h3>
          
          <form method="post">
              <label for="senha_atual" style="font-weight: bold; color: #6b7280; font-size: 0.9em; display: block; margin-bottom: 5px;">Senha Atual</label>
              <input type="password" name="senha_atual" id="senha_atual" required placeholder="Digite a senha atual..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px;">
              
              <label for="nova_senha" style="font-weight: bold; color: #6b7280; font-size: 0.9em; display: block; margin-bottom: 5px;">Nova Senha</label>
              <input type="password" name="nova_senha" id="nova_senha" required placeholder="Mínimo de 6 caracteres" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px;">
              
              <label for="confirmar_senha" style="font-weight: bold; color: #6b7280; font-size: 0.9em; display: block; margin-bottom: 5px;">Confirmar Nova Senha</label>
              <input type="password" name="confirmar_senha" id="confirmar_senha" required placeholder="Repita a nova senha" style="width: 100%; padding: 10px; margin-bottom: 25px; border: 1px solid #d1d5db; border-radius: 6px;">
              
              <button type="submit" style="width: 100%; background: #0d9488; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.3s; margin-bottom: 15px;">
                  Atualizar Senha
              </button>
          </form>
          
          <a href="{{ url_for('core.index') }}" style="display: block; text-align: center; background: #f3f4f6; color: #4b5563; padding: 12px; border-radius: 5px; text-decoration: none; font-weight: bold; border: 1px solid #d1d5db; transition: background 0.3s;">
              &larr; Voltar ao Dashboard
          </a>
      </div>
  </div>
{% endblock %}
