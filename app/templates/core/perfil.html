{% extends 'base.html' %}

{% block content %}
  <header style="margin-bottom: 30px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px;">
      <h2 style="color: #064e3b; display: flex; align-items: center; gap: 10px; margin: 0;">
          <span style="font-size: 1.5rem;">👤</span> Perfil do Tutor
      </h2>
  </header>

  <div style="background: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #e5e7eb; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: bold; color: #6b7280; font-size: 0.9em; margin-bottom: 5px;">Nome Completo</label>
          <div style="font-size: 1.1em; color: #1f2937; padding: 10px; background: #f9fafb; border-radius: 5px; border: 1px solid #e5e7eb;">
              {{ g.tutor['nome'] }}
          </div>
      </div>

      <div style="margin-bottom: 30px;">
          <label style="display: block; font-weight: bold; color: #6b7280; font-size: 0.9em; margin-bottom: 5px;">E-mail de Acesso</label>
          <div style="font-size: 1.1em; color: #1f2937; padding: 10px; background: #f9fafb; border-radius: 5px; border: 1px solid #e5e7eb;">
              {{ g.tutor['email'] }}
          </div>
      </div>

      <div style="border-top: 1px solid #e5e7eb; padding-top: 20px;">
          <p style="color: #9ca3af; font-size: 0.85em; margin-bottom: 15px;">
              A alteração de senha e edição de dados estarão disponíveis na próxima versão do sistema.
          </p>
          <a href="{{ url_for('core.index') }}" style="display: block; text-align: center; background: #f3f4f6; color: #4b5563; padding: 12px; border-radius: 5px; text-decoration: none; font-weight: bold; border: 1px solid #d1d5db; transition: background 0.3s;">
              &larr; Voltar ao Dashboard
          </a>
      </div>
  </div>
{% endblock %}
