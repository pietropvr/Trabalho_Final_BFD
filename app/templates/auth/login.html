{% extends 'base.html' %}

<!-- ESTES DOIS BLOCOS VAZIOS ANULAM O MENU LATERAL -->
{% block layout_class %}layout-auth{% endblock %}
{% block sidebar %}{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; text-align: center;">
    
    <img src="{{ url_for('static', filename='patas.png') }}" alt="Logo Caderneta PET" style="width: 55px; height: 55px; margin-bottom: 15px; object-fit: contain;">
    
    <h2 style="color: #064e3b; margin-bottom: 25px;">Bem-vindo de volta!</h2>
    
    <form method="post" style="text-align: left;">
        <label for="email" style="font-weight: bold; color: #374151; display: block;">E-mail</label>
        <input type="email" name="email" id="email" required placeholder="seu@email.com" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">

        <label for="senha" style="font-weight: bold; color: #374151; display: block;">Senha</label>
        <input type="password" name="senha" id="senha" required placeholder="••••••••" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 25px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">

        <button type="submit" style="width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: filter 0.3s;">
            Entrar no Sistema
        </button>
    </form>
    
    <p style="margin-top: 20px; color: #6b7280; font-size: 0.9rem;">
        Não tem conta? <a href="{{ url_for('auth.register') }}" style="color: #10b981; text-decoration: none; font-weight: bold;">Cadastre-se grátis</a>
    </p>
</div>
{% endblock %}
