{% extends 'base.html' %}
{% block content %}
<div class="cadastro-container">
	<h2>Cadastre-se como Tutor</h2>
	<p>Crie sua conta para gerenciar a saúde dos seus pets.</p>
	
<!-- Formulário que envia os dados via POST para a rota /cadastro -->
<form method="POST" action="/cadastro" class="form-basico">
	<div class="form-group">
	<label for="nome">Nome Completo:</label>
	<input type="text" id="nome" name="nome" required>
	</div>
	
	<div class="form-group">
	<label for="email">E-mail:</label>
	<input type="email" id="email" name="email" required>
	</div>
	
	<div class="form-group">
	<label for="senha">Senha:</label>
	<input type="password" id="senha" name="senha" required>
	</div>
	<button type="submit" class="btn-primario">Criar Conta</button>
</form>
</div>
{% endblock %}
